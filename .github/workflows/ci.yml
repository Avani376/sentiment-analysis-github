name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Keep CI hermetic: no transformer downloads; TF-IDF adapters cover the suite.
      SENTINEX_ENABLE_DISTILBERT: "false"
      SENTINEX_LOG_LEVEL: "WARNING"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest

  legacy-streamlit-smoke:
    # The original Streamlit app must keep working during the migration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned runtime
        run: pip install -r requirements.txt
      - name: Import check of the Streamlit entry point
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('app/app.py').read_text(encoding='utf-8')); print('app.py parses OK')"
