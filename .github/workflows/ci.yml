name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Keep CI hermetic: no transformer downloads; TF-IDF adapters cover the suite.
      SENTINEX_ENABLE_DISTILBERT: "false"
      SENTINEX_LOG_LEVEL: "WARNING"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          {
            echo "### pip freeze (backend)"
            echo '```'
            pip freeze
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: |
          # python -m guarantees the working directory is on sys.path; verbose
          # output goes to the public job summary so failures are debuggable
          # without an authenticated log download.
          python -m pytest -v 2>&1 | tee pytest-output.txt
          echo "PYTEST_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          {
            echo "### pytest -v"
            echo '```'
            cat pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$PYTEST_EXIT"

  legacy-streamlit-smoke:
    # The original Streamlit app must keep working during the migration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned runtime
        run: pip install -r requirements.txt
      - name: Import check of the Streamlit entry point
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('app/app.py').read_text(encoding='utf-8')); print('app.py parses OK')"
